services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ssm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssm}
      POSTGRES_USER: ${POSTGRES_USER:-ssm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssm_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssm_user} -d ${POSTGRES_DB:-ssm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssm}
      POSTGRES_USER: ${POSTGRES_USER:-ssm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssm_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      REPORT_DIR: ${REPORT_DIR:-generated_reports}
      ANNOTATION_FILE: /app/data/runtime/annotations.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - annotation-data:/app/data/runtime
    depends_on:
      postgres:
        condition: service_healthy

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:5173"
  #   depends_on:
  #     - backend

volumes:
  postgres-data:
  annotation-data:
