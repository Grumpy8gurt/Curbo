services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: curbo-postgres
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curbo}
      POSTGRES_USER: ${POSTGRES_USER:-curbo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curbo_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curbo_user} -d ${POSTGRES_DB:-curbo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      REPORT_DIR: /app/generated_reports
      ANNOTATION_FILE: /app/data/runtime/annotations.json
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - annotation-data:/app/data/runtime
      - report-data:/app/generated_reports

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:5173"
  #   depends_on:
  #     - backend

volumes:
  postgres-data:
  annotation-data:
  report-data:
