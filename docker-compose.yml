services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: curbo-postgres
    profiles: ["database"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curbo}
      POSTGRES_USER: ${POSTGRES_USER:-curbo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curbo_user} -d ${POSTGRES_DB:-curbo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: development
      AUTH_REQUIRED: "false"
      DATABASE_REQUIRED: "false"
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      REPORT_DIR: /app/generated_reports
      ANNOTATION_FILE: /app/data/runtime/annotations.json
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - annotation-data:/app/data/runtime
      - report-data:/app/generated_reports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0700
      - /var/run:size=1m,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  annotation-data:
  report-data:
