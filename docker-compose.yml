services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ssm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssm}
      POSTGRES_USER: ${POSTGRES_USER:-ssm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssm_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssm_user} -d ${POSTGRES_DB:-ssm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssm}
      POSTGRES_USER: ${POSTGRES_USER:-ssm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssm_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      REPORT_DIR: ${REPORT_DIR:-generated_reports}
      ML_SERVICE_URL: http://ml:9000/detect
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started

  ml:
    build: ./ml
    environment:
      ML_PORT: ${ML_PORT:-9000}
    ports:
      - "${ML_PORT:-9000}:9000"

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:5173"
  #   depends_on:
  #     - backend

volumes:
  postgres-data:
